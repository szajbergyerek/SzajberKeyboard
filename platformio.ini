; ESP32-S3 N16R8 DevKitC-1: wired USB keyboard to BLE keyboard bridge.
; The native USB pins (GPIO19 D-, GPIO20 D+) run in USB host mode, so USB CDC
; and TinyUSB device mode stay disabled. Serial logging goes to UART0 ("COM" port).

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3

[env:usb]
upload_speed = 921600
monitor_filters = esp32_exception_decoder

[env:ota]
upload_protocol = espota
upload_port = 192.168.1.240
upload_flags =
    --port=3232
